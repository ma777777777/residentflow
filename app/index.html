<title>ResidentFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f7f7;
  --surface: #ffffff;
  --surface-2: #eef3f2;
  --fg: #14211f;
  --muted: #56645f;
  --faint: #7d8b88;
  --line: #d9e1e0;
  --accent: #0b6e69;
  --accent-ink: #ffffff;
  --accent-soft: #dff1ef;
  --chart: #0a8f86;
  --grid: #e3e9e8;
  --night: #4338ca;
  --night-soft: #e9e8fd;
  --call: #b42318;
  --call-soft: #fde8e6;
  --warn: #9a3f07;
  --warn-soft: #fdf0e1;
  --off: #067647;
  --off-soft: #e3f5ea;
  --shadow: 0 1px 2px rgba(20, 33, 31, .06), 0 6px 20px rgba(20, 33, 31, .07);
  --scrim: rgba(10, 20, 19, .45);
  --radius: 16px;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1514;
    --surface: #16201f;
    --surface-2: #1d2a28;
    --fg: #e6efed;
    --muted: #a3b4b1;
    --faint: #7b8d8a;
    --line: #2a3836;
    --accent: #4cc3b8;
    --accent-ink: #06201d;
    --accent-soft: #163a36;
    --chart: #2fa89d;
    --grid: #243230;
    --night: #a5a6f6;
    --night-soft: #25264a;
    --call: #f97066;
    --call-soft: #3d1a17;
    --warn: #fdb022;
    --warn-soft: #3a2a10;
    --off: #47cd89;
    --off-soft: #123323;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1514;
  --surface: #16201f;
  --surface-2: #1d2a28;
  --fg: #e6efed;
  --muted: #a3b4b1;
  --faint: #7b8d8a;
  --line: #2a3836;
  --accent: #4cc3b8;
  --accent-ink: #06201d;
  --accent-soft: #163a36;
  --chart: #2fa89d;
  --grid: #243230;
  --night: #a5a6f6;
  --night-soft: #25264a;
  --call: #f97066;
  --call-soft: #3d1a17;
  --warn: #fdb022;
  --warn-soft: #3a2a10;
  --off: #47cd89;
  --off-soft: #123323;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(104px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

/* header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 6;
  background: var(--bg);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0 10px;
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: .01em; color: var(--accent); }
.today-date { font-size: 15px; color: var(--muted); }

/* sections */
section { margin: 0 0 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
h2 { font-size: 15px; margin: 0; font-weight: 700; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 2px 8px; }
.sec-h h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 14px; }
p { margin: 0; }

/* context */
.ctx { padding: 2px 2px 4px; }
.ctx-rot { font-size: 22px; font-weight: 700; line-height: 1.2; }
.ctx-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.ctx-hours { margin-top: 6px; font-size: 14px; color: var(--muted); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px 3px 8px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--fg);
  white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.t-night { background: var(--night-soft); } .t-night i { background: var(--night); }
.t-call { background: var(--call-soft); } .t-call i { background: var(--call); }
.t-warn { background: var(--warn-soft); } .t-warn i { background: var(--warn); }
.t-off { background: var(--off-soft); } .t-off i { background: var(--off); }

/* buttons */
.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font-weight: 700;
  font-size: 16px;
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn.danger { color: var(--call); border-color: var(--call); background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.link {
  appearance: none;
  background: none;
  border: 0;
  padding: 8px 2px;
  min-height: 40px;
  color: var(--accent);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
.link.quiet { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.actions .btn { flex: 1 1 140px; }
.sub-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; }

/* the one job */
.job { padding: 20px; box-shadow: var(--shadow); }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
.big { margin-top: 8px; font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .n { font-family: var(--mono); font-size: 52px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.topic { margin-top: 6px; font-size: 22px; font-weight: 700; line-height: 1.25; }
.note { margin-top: 6px; color: var(--muted); font-size: 15px; }
.steps { margin: 14px 0 0; padding: 12px 14px 12px 34px; background: var(--surface-2); border-radius: 12px; font-size: 15px; }
.steps li { margin: 3px 0; }
.when { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 15px; }
.when svg { flex: none; color: var(--accent); }
.reason { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); font-size: 15px; }
.tip { margin-top: 12px; font-size: 14px; color: var(--muted); }
.job.is-done .eyebrow { color: var(--off); }
.job.is-skip .eyebrow, .job.is-rest .eyebrow { color: var(--muted); }

/* forms */
.form { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 6px; }
input[type="number"], input[type="url"], input[type="search"], select, textarea {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--fg);
}
textarea { resize: vertical; line-height: 1.4; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
.stepper input { text-align: center; font-family: var(--mono); font-size: 20px; }
.stepper .btn { padding: 0; min-height: 46px; font-size: 22px; }
.counter { text-align: right; font-size: 13px; color: var(--faint); margin-top: 4px; }

/* optional list */
.opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.opt + .opt { border-top: 1px solid var(--line); }
.opt-body { flex: 1; min-width: 0; }
.opt-title { font-weight: 700; font-size: 15px; }
.opt-sub { font-size: 14px; color: var(--muted); }
.list-card { padding: 0; overflow: hidden; }
.tick {
  appearance: none;
  flex: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--surface);
  display: grid; place-items: center;
  color: transparent;
  cursor: pointer;
}
.tick[aria-pressed="true"] { background: var(--off); border-color: var(--off); color: var(--surface); }

/* week strip */
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.meter span { display: block; height: 100%; background: var(--chart); border-radius: 999px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.cell {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 6px 0 7px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  cursor: pointer;
  min-width: 0;
}
.cell .dl { font-size: 12px; color: var(--muted); }
.cell .dn { font-size: 15px; font-weight: 700; }
.cell .mk { font-family: var(--mono); font-size: 12px; color: var(--faint); min-height: 16px; }
.cell.is-today { border: 2px solid var(--accent); padding: 5px 0 6px; }
.cell.st-done { background: var(--off-soft); border-color: transparent; }
.cell.st-done .mk { color: var(--off); font-weight: 600; }
.cell.st-skip .mk { color: var(--muted); }
.cell.is-today.st-done { border-color: var(--accent); }

/* rows */
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.drow {
  appearance: none; width: 100%; text-align: left;
  display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 10px;
  padding: 12px 14px; background: none; border: 0; cursor: pointer;
}
.drow + .drow, .blk + .blk { border-top: 1px solid var(--line); }
.drow .d { font-size: 14px; font-weight: 700; }
.drow .d small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.drow .t { min-width: 0; font-size: 15px; }
.drow .t .chip { margin-bottom: 3px; }
.drow .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .q { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.drow.is-today { background: var(--accent-soft); }
.blk { display: grid; grid-template-columns: 42px 1fr; gap: 10px; padding: 11px 14px; align-items: baseline; }
.blk .id { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.blk .nm { font-weight: 700; font-size: 15px; }
.blk .dt { font-size: 13px; color: var(--muted); }
.blk.past { opacity: .55; }
.blk.now { background: var(--accent-soft); }
.blk.now .id { color: var(--accent); font-weight: 600; }

/* stats */
.hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.hero .n { font-family: var(--mono); font-size: 48px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.chart { margin-top: 12px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.chart .axv { fill: var(--fg); font-size: 12px; font-family: var(--mono); font-weight: 600; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .tl { stroke: var(--muted); stroke-width: 1; }
.chart .bar { fill: var(--chart); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .bar, .chart .hit.on + .bar { opacity: .8; }
.readout { min-height: 22px; margin-top: 6px; font-size: 14px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.r, th.r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.topic-cell { white-space: normal; min-width: 140px; }

/* pearls */
.pearl { padding: 14px 16px; }
.pearl + .pearl { border-top: 1px solid var(--line); }
.pearl-text { font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pearl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.pearl-meta a { font-weight: 700; }
.pearl .actions { margin-top: 10px; }
.pearl.retired .pearl-text { color: var(--muted); }

/* sessions */
.sess { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding: 12px 14px; }
.sess + .sess { border-top: 1px solid var(--line); }
.sess-time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; line-height: 1.35; padding-top: 2px; }
.sess-time small { display: block; color: var(--muted); font-size: 12px; }
.sess-title { font-weight: 700; font-size: 15px; }
.sess-sub { font-size: 14px; color: var(--muted); }
.more > summary { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--accent); font-weight: 700; font-size: 15px; cursor: pointer; }
.more[open] > summary { border-bottom: 1px solid var(--line); }
.drow small.sn { display: block; font-size: 13px; color: var(--muted); }
.sheet .sess { padding: 10px 0; }
.sheet .sec-h h2 { font-size: 13px; }
.sheet .form { margin-top: 4px; padding-top: 0; border-top: 0; }
.nudge { padding: 14px 16px; background: var(--warn-soft); border-color: transparent; }
.nudge .sub-actions { margin-top: 4px; }

/* banner, empty, loading */
.banner { padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); font-size: 15px; margin-bottom: 14px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 15px; }
.skel { height: 18px; border-radius: 8px; background: var(--surface-2); margin: 10px 0; }
.skel.w60 { width: 60%; } .skel.w40 { width: 40%; } .skel.tall { height: 120px; border-radius: var(--radius); }

/* tab bar */
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 8;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab {
  appearance: none; border: 0; background: none; color: var(--muted);
  font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 4px; min-height: 52px; cursor: pointer;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tab .plus {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  margin-top: -14px; box-shadow: var(--shadow);
}

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet-in {
  width: 100%; max-width: 560px; max-height: 92%;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2 { font-size: 19px; }
.sheet .hint { margin-top: 6px; font-size: 14px; color: var(--muted); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.opts .btn { justify-content: flex-start; font-size: 15px; }
.opts .btn[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.phi { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--call-soft); font-size: 15px; }
.phi strong { color: var(--call); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  z-index: 30; max-width: min(92vw, 520px);
  padding: 12px 16px; border-radius: 12px;
  background: var(--fg); color: var(--bg);
  font-size: 15px; box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: no-preference) {
  .sheet-in { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); } to { transform: none; } }
}
@media (min-width: 600px) {
  .sheet { align-items: center; }
  .sheet-in { border-radius: 20px; }
}
</style>

<div class="wrap">
  <header class="top">
    <span class="brand">ResidentFlow</span>
    <span class="today-date" id="hdr-date"></span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Sections">

    <button class="tab" data-act="tab" data-view="today" id="tab-today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Today
    </button>
    <button class="tab" data-act="tab" data-view="schedule" id="tab-schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Schedule
    </button>
    <button class="tab" data-act="capture" id="tab-capture" aria-label="Quick capture">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      Capture
    </button>
    <button class="tab" data-act="tab" data-view="study" id="tab-study">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Study
    </button>
    <button class="tab" data-act="tab" data-view="pearls" id="tab-pearls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg>
      Pearls
    </button>
  </div>
</nav>

<div id="sheet" hidden></div>

<script>
(() => {
  'use strict';

  // ---------- helpers ----------
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const dow = (s) => parse(s).getDay();
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const weekStart = (s) => addDays(s, -dow(s)); // weeks run Sunday to Saturday
  const todayStr = () => ymd(new Date());
  const fmt = (s, o) => parse(s).toLocaleDateString('en-GB', o);
  const fmtShort = (s) => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtDM = (s) => fmt(s, { day: 'numeric', month: 'short' });
  const safeUrl = (u) => (/^(https?:|onenote:)/i.test(String(u || '').trim()) ? String(u).trim() : '');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  const AMBOSS_URL = 'https://next.amboss.com/us/customsession';
  // AMBOSS study plan "Internal Medicine (ABIM)": one module per ABIM blueprint area.
  // Each module is a single long session; progress only counts questions answered inside it.
  const AMBOSS_COURSE = 'https://next.amboss.com/us/courses/cG0ayh';
  const MODULES = {
    'Cardiovascular Disease': ['iRSJ5za', 'Cardiology'],
    'Pulmonary Disease': ['QRSu5za', 'Pulmonology'],
    'Infectious Disease': ['jRS_5za', 'Infectious disease'],
    'Gastroenterology': ['PRSWMza', 'Gastroenterology'],
    'Endocrinology, Diabetes, and Metabolism': ['4RS3Mza', 'Endocrinology'],
    'Rheumatology and Orthopedics': ['kRSmMza', 'Rheumatology'],
    'Hematology': ['ORSIMza', 'Hematology'],
    'Medical Oncology': ['lRSvMza', 'Oncology'],
    'Nephrology and Urology': ['NRS-Mza', 'Nephrology'],

    'Psychiatry': ['5RSinza', 'Psychiatry'],
    'Dermatology': ['MRSMnza', 'Dermatology'],
    'Allergy and Immunology': ['nRS7nza', 'Allergy and immunology'],

  const ICON_CLOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  // ---------- rotation rules ----------
  // Each block in the db has a code; these are the defaults for that code.
  // A block can override label, hours and slot.
  const ROT = {
    'Free Elective': { kind: 'elective', label: 'Free elective', hours: 'Elective hours', slot: '10 am, before anything else', count: 15 },
    'EJ': { kind: 'elective', label: 'Elective, on the jeopardy list', hours: 'Elective hours, unless you are pulled in', slot: '2 pm, after the elective', count: 10 },
    'E-CCU': { kind: 'elective', label: 'Elective with CCU call every 4th day', hours: 'Elective hours, CCU call every 4th day', slot: '2 pm on non-call days', count: 10 },
    'OPD-ICU': { kind: 'elective', label: 'OPD with ICU call every 4th day', hours: 'OPD hours, ICU call every 4th day', slot: 'Evening on non-call days', count: 10 },
    'Float': { kind: 'nights', label: 'Float, night call', hours: '7:30 pm to 7:30 am, Sunday to Friday nights', slot: '5 pm, before your shift', count: 10 },
    'Adm AM': { kind: 'day', label: 'Admitting AM', hours: '7:00 am to 2:30 pm', slot: '4 pm, once you are home', count: 10 },
    'Adm PM': { kind: 'day', label: 'Admitting PM', hours: '2:30 pm to 7:30 pm', slot: '10 am, before your shift', count: 10 },

    'CCU': { kind: 'full', label: 'CCU', hours: 'Calls come by email each block', slot: '8 pm, after dinner', count: 10 },
    'ED': { kind: 'full', label: 'Emergency department', hours: 'Shifts come by email each block', slot: 'Before or after your shift', count: 10 },
    'Floor': { kind: 'full', label: 'Floor', hours: 'Calls come by email each block', slot: '8 pm, after dinner', count: 10 },
    'Vacation': { kind: 'vacation', label: 'Vacation', hours: 'Off', slot: 'Any time, if you want', count: 0 },
  };
  const DT = {
    normal: { label: 'Working day', tone: '' },
    elective: { label: 'Elective day', tone: '' },
    night: { label: 'Night shift', tone: 't-night' },
    call: { label: 'On call', tone: 't-call' },
    postcall: { label: 'Post-call', tone: 't-warn' },
    off: { label: 'Day off', tone: 't-off' },
    vacation: { label: 'Vacation', tone: 't-off' },
    pulled: { label: 'Pulled in', tone: 't-warn' },
  };
  const AREAS = ['Cardiology', 'Pulmonology', 'Critical care', 'Gastroenterology & hepatology', 'Nephrology', 'Endocrinology', 'Hematology & oncology', 'Infectious disease', 'Rheumatology', 'Neurology', 'Geriatrics & general IM', 'Other'];
  // Plan rows store the exact AMBOSS filter label; the app shows the specialty name.
  // AMBOSS has no Cardiology or Nephrology discipline: specialties map to Systems,
  // except ID, oncology, critical care and geriatrics, which are Disciplines.
  const SPECIALTY = {
    'Cardiovascular System': 'Cardiology',
    'Respiratory System': 'Pulmonology',
    'Gastrointestinal System': 'Gastroenterology and hepatology',
    'Renal & Urinary Systems': 'Nephrology',
    'Endocrine System': 'Endocrinology',
    'Blood & Lymphoreticular Systems': 'Hematology',
    'Musculoskeletal System': 'Rheumatology and musculoskeletal',
    'Immune System': 'Immunology and allergy',
    'Nervous System & Special Senses': 'Neurology',
    'Skin & Subcutaneous Tissue': 'Dermatology',
    'Behavioral Health': 'Psychiatry',
    'Infectious diseases': 'Infectious disease',
    'Oncology': 'Oncology',
    'Critical care': 'Critical care',
    'Aging': 'Geriatrics',
  };

  // ---------- state ----------
  let db = null;
  const S = {
    status: 'loading', // loading | ready | nodb
    view: 'today',
    blocks: [],
    plan: {},
    log: {},
    days: {},
    extras: {},
    captures: [],
    sessions: {},
    settings: {},
    form: null, // { ds, q, pct }
    sheet: null, // { kind: 'day', ds } | { kind: 'capture' }
    cap: { text: '', area: 'Cardiology', link: '', phi: null },
    pearlQuery: '',
    confirmDel: null,
    showRetired: false,
    chartSel: null,
    busy: false,
  };

  // ---------- derived ----------
  function blockFor(ds) { return S.blocks.find((b) => b.start <= ds && ds <= b.end) || null; }
  function rotFor(b) {
    if (!b) return null;
    const key = ROT[b.code] ? b.code : (/^Floor/i.test(b.code || '') ? 'Floor' : null);
    const base = key ? ROT[key] : { kind: 'full', label: b.code || 'Rotation', hours: '', slot: 'Pick one fixed time', count: 10 };
    return Object.assign({}, base, {
      label: b.label || (key === 'Floor' ? b.code : base.label),
      hours: b.hours || base.hours,
      slot: b.slot || base.slot,
    });
  }
  function dayInfo(ds, ignoreOverride) {
    const block = blockFor(ds);
    const rot = rotFor(block);
    const ov = ignoreOverride ? null : (S.days[ds] || null);
    const wd = dow(ds);
    let type;
    if (ov && ov.type && ov.type !== 'auto') type = ov.type;
    else if (!rot) type = 'normal';
    else if (rot.kind === 'vacation') type = 'vacation';
    else if (rot.kind === 'nights') type = wd === 6 ? 'off' : 'night';
    else if (rot.kind === 'elective') type = (wd === 0 || wd === 6) ? 'off' : 'elective';
    else type = 'normal';
    return { ds, block, rot, type, rough: !!(ov && ov.rough), auto: !(ov && ov.type && ov.type !== 'auto') };
  }
  function studyFor(di) {
    const p = S.plan[di.ds] || null;
    const min = num(S.settings.minDay, 10);
    const r = di.rot;
    const out = {
      count: p ? num(p.count, min) : (r ? (di.type === 'off' ? min : r.count) : min),
      topic: p && p.topic ? p.topic : null,
      filter: (p && p.filter) || 'Systems',
      kind: (p && p.kind) || 'study',
      optional: !!(p && p.optional),
      note: (p && p.note) || '',
      slot: (p && p.slot) || (r && r.slot) || 'Pick one fixed time',
      reason: '',
      planned: !!p,
    };
    if (di.type === 'call') { out.count = 0; out.kind = 'rest'; out.reason = 'On call. No questions today: getting through the shift is the job.'; }
    else if (di.type === 'postcall') { out.count = 0; out.kind = 'rest'; out.reason = 'Post-call. Sleep first. Nothing is due today.'; }
    else if (di.type === 'vacation' && !p) { out.count = 0; out.kind = 'rest'; out.reason = 'Vacation. Nothing is due.'; }
    else if (di.type === 'pulled') {
      out.count = Math.min(out.count, min); out.slot = 'Evening, after the shift';
      out.reason = 'Pulled in, so today is the minimum, in the evening.';
    } else if (di.rough && out.count > 0) {
      out.count = Math.min(out.count, min);
      out.reason = 'Rough day: just the minimum. That still counts.';
    }
    if (out.count === 0 && out.kind !== 'rest') out.kind = 'rest';
    if (out.kind === 'rest' && !out.reason) out.reason = out.note || 'Rest day.';
    return out;
  }
  function typeLabel(di) { return (DT[di.type] || DT.normal).label; }
  function chip(di) {
    const t = DT[di.type] || DT.normal;
    return `<span class="chip ${t.tone}"><i></i>${esc(t.label)}${di.rough ? ', rough' : ''}</span>`;
  }
  function weekTotal(ws) {
    let t = 0;
    for (let i = 0; i < 7; i++) { const l = S.log[addDays(ws, i)]; if (l && l.status === 'done') t += num(l.questions, 0); }
    return t;
  }
  function pearlsDue(ds) {
    return S.captures.filter((c) => c.status !== 'retired' && c.nextReview && c.nextReview <= ds);
  }
  function sessionsOn(ds) {
    return Object.entries(S.sessions)
      .map(([id, x]) => Object.assign({ id }, x))
      .filter((x) => x.date === ds)
      .sort((a, b) => ((a.start || '') < (b.start || '') ? -1 : 1));
  }
  function fmtTime(t) {
    const [h, m] = String(t || '').split(':').map(Number);
    if (isNaN(h)) return '';
    return `${((h + 11) % 12) + 1}:${pad(m || 0)} ${h >= 12 ? 'pm' : 'am'}`;
  }
  function sessRows(list) {
    return list.map((x) => `<div class="sess"><div class="sess-time">${esc(fmtTime(x.start))}<small>to ${esc(fmtTime(x.end))}</small></div><div><div class="sess-title">${esc(x.title)}</div>${x.topic ? `<div class="sess-sub">${esc(x.topic)}</div>` : ''}${x.place ? `<div class="sess-sub">${esc(x.place)}</div>` : ''}</div></div>`).join('');
  }
  function sessionsCard(ds, di) {
    const list = sessionsOn(ds);

    h += core.length ? sessRows(core) : '<div class="empty">No resident sessions today.</div>';
    if (opt.length) h += `<details class="more"><summary>${plural(opt.length, 'division session')}, optional</summary>${sessRows(opt)}</details>`;
    return h + '</section>';
  }
  function filterLine(st) {
    if (st.kind === 'review') return 'Status: Marked (questions you flagged)';
    if (!st.topic) return 'No filter: all systems';

  function ambossUrl(st) { return isModule(st) ? `${AMBOSS_COURSE}/${MODULES[st.topic][0]}` : AMBOSS_URL; }

  // ---------- writes ----------
  function toast(msg) {

    return 'Could not save. Check your connection and try again.';

  function viewToday(ds) {
    const di = dayInfo(ds);

  function jobCard(ds, di, st) {

  // A planned study day that ended without a log: ask once, on the next day.
  function yesterdayNudge(ds) {
    const y = addDays(ds, -1);
    if (S.log[y]) return '';

  function doneForm() {
    const f = S.form;

      <div class="stepper">
        <button class="btn" data-act="q-step" data-n="-5" aria-label="5 fewer">&minus;</button>
        <input id="f-q" type="number" inputmode="numeric" min="1" max="300" value="${esc(f.q)}">
        <button class="btn" data-act="q-step" data-n="5" aria-label="5 more">+</button>
      </div>
      <label for="f-pct">Percent correct <span class="faint">(optional, AMBOSS shows it at the end)</span></label>
      <input id="f-pct" type="number" inputmode="numeric" min="0" max="100" placeholder="e.g. 80" value="${esc(f.pct)}">
      <div class="actions">
        <button class="btn primary" data-act="done-save">Save</button>
        <button class="btn ghost" data-act="done-cancel">Cancel</button>
      </div>
    </div>`;
  }

  function weekCard(ds) {
    const ws = weekStart(ds);
    const total = weekTotal(ws);
    const target = num(S.settings.weeklyTarget, 60);
    const pct = Math.min(100, Math.round((total / target) * 100));
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const l = S.log[d];
      let cls = 'cell', mk = '';
      if (l && l.status === 'done') { cls += ' st-done'; mk = String(num(l.questions, 0)); }
      else if (l && l.status === 'skipped') { cls += ' st-skip'; mk = 'skip'; }
      else if (d >= ds) { const s = studyFor(dayInfo(d)); mk = s.count ? String(s.count) : 'rest'; }
      else mk = '&middot;';
      if (d === ds) cls += ' is-today';
      cells += `<button class="${cls}" data-act="day-open" data-ds="${d}" aria-label="${esc(fmtShort(d))}"><span class="dl">${fmt(d, { weekday: 'narrow' })}</span><span class="dn">${parse(d).getDate()}</span><span class="mk">${mk}</span></button>`;
    }
    return `<div class="sec-h"><h2>This week</h2><span class="num small">${total} of ${target}</span></div>
      <section class="card">
        <div class="meter" role="img" aria-label="${total} of ${target} questions this week"><span style="width:${pct}%"></span></div>
        <div class="strip">${cells}</div>
        <p class="tip">A missed day is dropped, never added to tomorrow.</p>
      </section>`;
  }

  function comingUp(ds) {
    let rows = '';
    for (let i = 1; i <= 3; i++) rows += dayRow(addDays(ds, i), ds);
    const next = S.blocks.find((b) => b.start > ds);
    let nx = '';
    if (next) {
      const n = daysBetween(ds, next.start);
      nx = `<p class="tip" style="padding:0 14px 14px">Next rotation: <strong>${esc(rotFor(next).label)}</strong> from ${esc(fmtShort(next.start))} (in ${plural(n, 'day')}).</p>`;
    }
    return `<div class="sec-h"><h2>Coming up</h2></div><section class="card list-card">${rows}${nx}</section>`;
  }

  function dayRow(d, ds) {
    const di = dayInfo(d);
    const st = studyFor(di);
    const l = S.log[d];
    let q = st.count ? `${st.count} Qs` : 'rest';
    if (l && l.status === 'done') q = `${num(l.questions, 0)} done`;
    else if (l && l.status === 'skipped') q = 'skipped';
    const what = st.kind === 'rest' ? (st.reason || 'Rest') : topicTitle(st);
    return `<button class="drow${d === ds ? ' is-today' : ''}" data-act="day-open" data-ds="${d}">
      <span class="d">${esc(fmt(d, { weekday: 'short' }))} ${parse(d).getDate()}<small>${esc(fmt(d, { month: 'short' }))}</small></span>
      <span class="t">${chip(di)}<div>${esc(what)}</div>${(() => { const n = sessionsOn(d).filter((x) => x.kind === 'core').length; return n ? `<small class="sn">${plural(n, 'resident session')}</small>` : ''; })()}</span>
      <span class="q">${esc(q)}</span>
    </button>`;
  }

  function viewSchedule(ds) {
    let rows = '';
    for (let i = 0; i < 14; i++) rows += dayRow(addDays(ds, i), ds);
    let blocks = '';
    for (const b of S.blocks) {
      const r = rotFor(b);
      const cls = b.end < ds ? 'blk past' : (b.start <= ds ? 'blk now' : 'blk');
      blocks += `<div class="${cls}"><span class="id">${esc(b.id)}</span><div><div class="nm">${esc(r.label)}</div><div class="dt">${esc(fmtShort(b.start))} to ${esc(fmtShort(b.end))}</div></div></div>`;
    }
    return `<div class="sec-h" style="margin-top:6px"><h2>Next 14 days</h2></div>
      <section class="card list-card">${rows}</section>
      <p class="tip" style="padding:0 2px">Tap a day to mark it on call, post-call, off, or pulled in. When a call schedule arrives by email, send it to Claude in your project and it will mark the days for you.</p>
      <div class="sec-h"><h2>Your year, AY 2026&ndash;27</h2><span class="small muted">${S.blocks.length} blocks</span></div>
      <section class="card list-card">${blocks || '<div class="empty">No blocks loaded yet.</div>'}</section>`;
  }

  function viewStudy(ds) {
    const ws = weekStart(ds);
    const total = weekTotal(ws);
    const target = num(S.settings.weeklyTarget, 60);
    let daysDone = 0;
    for (let i = 0; i < 7; i++) { const l = S.log[addDays(ws, i)]; if (l && l.status === 'done') daysDone++; }
    const a = S.settings.amboss || null;
    let amb = '';
    if (a && a.total) {
      let since = 0;
      for (const [d, l] of Object.entries(S.log)) if (d >= a.asOf && l.status === 'done') since += num(l.questions, 0);
      const est = Math.min(a.total, num(a.answered, 0) + since);
      const p = Math.round((est / a.total) * 100);
      amb = `<div class="sec-h"><h2>AMBOSS ABIM Qbank</h2><span class="small muted">checked ${esc(fmtDM(a.asOf))}</span></div>
        <section class="card">
          <div class="row"><span><span class="num" style="font-size:22px;font-weight:600">${est.toLocaleString('en-US')}</span> <span class="muted">of ${Number(a.total).toLocaleString('en-US')} answered</span></span><span class="num muted">${p}%</span></div>
          <div class="meter"><span style="width:${p}%"></span></div>
          <p class="tip">${num(a.answered, 0).toLocaleString('en-US')} at the last check plus ${since} you logged since.${typeof a.pct === 'number' ? ` ${a.pct}% correct` : ''}${typeof a.percentile === 'number' ? `, ${a.percentile}th percentile` : ''}. Claude updates this every Sunday.</p>
        </section>`;
    }
    const exam = S.settings.examLabel ? `<p class="tip" style="padding:0 2px">${esc(S.settings.examLabel)}: ${esc(S.settings.examMonth || '')}.</p>` : '';
    const hist = Object.entries(S.log).filter(([d]) => d <= ds).sort((x, y) => (x[0] < y[0] ? 1 : -1)).slice(0, 28);
    let rows = '';
    for (const [d, l] of hist) {
      rows += `<tr><td>${esc(fmtShort(d))}</td><td class="topic-cell">${l.status === 'skipped' ? '<span class="muted">Skipped</span>' : esc(l.topic || '')}</td><td class="r">${l.status === 'done' ? num(l.questions, 0) : '&ndash;'}</td><td class="r">${typeof l.pct === 'number' ? l.pct + '%' : '&ndash;'}</td></tr>`;
    }
    return `<div class="sec-h" style="margin-top:6px"><h2>This week</h2><span class="small muted">${plural(daysDone, 'day')} studied</span></div>
      <section class="card">
        <div class="hero"><span class="n">${total}</span><span class="muted">of ${target} questions</span></div>
        <div class="meter"><span style="width:${Math.min(100, Math.round((total / target) * 100))}%"></span></div>
      </section>
      <div class="sec-h"><h2>Questions per week</h2><span class="small muted">last 8 weeks</span></div>
      <section class="card">
        <div class="chart" id="chart8"></div>
        <div class="readout" id="chart-readout">Tap a bar to see that week.</div>
      </section>
      ${amb}
      ${exam}
      <div class="sec-h"><h2>History</h2></div>
      <section class="card list-card">
        ${rows ? `<div class="table-wrap"><table><thead><tr><th>Day</th><th>Topic</th><th class="r">Qs</th><th class="r">Correct</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">Nothing logged yet. Your first "I\'m done" shows up here.</div>'}
      </section>
      <div class="sec-h"><h2>Backup</h2></div>
      <section class="card">
        <p class="small muted">Your data lives with this page on claude.ai, and Claude also copies it to your GitHub every Sunday. You can save your own copy too.</p>
        <div class="actions"><button class="btn sm" data-act="backup">Download my data (JSON)</button></div>
      </section>`;
  }

  function drawWeeksChart(ds) {
    const el = $('#chart8');
    if (!el) return;
    const W = Math.max(280, Math.round(el.clientWidth || 320));
    const H = 170, padL = 30, padR = 8, padT = 18, padB = 26;
    const target = num(S.settings.weeklyTarget, 60);
    const cur = weekStart(ds);
    const weeks = [];
    for (let i = 7; i >= 0; i--) { const w = addDays(cur, -7 * i); weeks.push({ w, v: weekTotal(w) }); }
    const maxV = Math.max(target, ...weeks.map((x) => x.v));
    const yMax = Math.ceil(maxV / 20) * 20 || 20;
    const ih = H - padT - padB, iw = W - padL - padR;
    const y = (v) => padT + ih - (v / yMax) * ih;
    const band = iw / weeks.length;
    const bw = Math.min(24, band * 0.56);
    const barPath = (x, yy, w, h, r) => {
      r = Math.min(r, h, w / 2);
      return `M${x},${yy + h}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + w - r}Q${x + w},${yy} ${x + w},${yy + r}V${yy + h}Z`;
    };
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Questions per week for the last 8 weeks, target ${target}">`;
    for (const t of [0, yMax / 2, yMax]) {
      s += `<line class="gl" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    }
    s += `<line class="tl" x1="${padL}" x2="${W - padR}" y1="${y(target)}" y2="${y(target)}"/><text class="ax" x="${W - padR}" y="${y(target) - 5}" text-anchor="end">target ${target}</text>`;
    weeks.forEach((wk, i) => {
      const cx = padL + band * i + band / 2;
      const x = cx - bw / 2;
      const h = (wk.v / yMax) * ih;
      const tip = `Week of ${fmtDM(wk.w)}: ${wk.v} questions`;
      s += `<rect class="hit${S.chartSel === wk.w ? ' on' : ''}" data-act="chart" data-tip="${esc(tip)}" data-w="${wk.w}" x="${padL + band * i}" y="${padT}" width="${band}" height="${ih + padB}"><title>${esc(tip)}</title></rect>`;
      s += h > 0 ? `<path class="bar" d="${barPath(x, y(wk.v), bw, h, 4)}"/>` : '<g></g>';
      // label every other week, ending on the current one, so labels never collide
      if ((weeks.length - 1 - i) % 2 === 0) s += `<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(fmtDM(wk.w))}</text>`;
      if (wk.w === cur && wk.v > 0) s += `<text class="axv" x="${cx}" y="${y(wk.v) - 6}" text-anchor="middle">${wk.v}</text>`;
    });
    s += '</svg>';
    el.innerHTML = s;
    if (S.chartSel) {
      const sel = weeks.find((x) => x.w === S.chartSel);
      if (sel) $('#chart-readout').textContent = `Week of ${fmtDM(sel.w)}: ${sel.v} questions`;
    }
  }

  function viewPearls(ds) {
    const due = pearlsDue(ds);
    let h = '';
    if (due.length) {
      h += `<div class="sec-h" style="margin-top:6px"><h2>Due for review</h2><span class="small muted">${due.length}</span></div><section class="card list-card">`;
      for (const c of due) {
        h += `<div class="pearl"><div class="pearl-text">${esc(c.text)}</div>${pearlMeta(c)}
          <div class="actions"><button class="btn sm primary" data-act="pearl-ok" data-id="${esc(c.id)}">I remembered it</button><button class="btn sm" data-act="pearl-again" data-id="${esc(c.id)}">Show again tomorrow</button></div></div>`;
      }
      h += '</section>';
    }
    const q = S.pearlQuery.trim().toLowerCase();
    const list = S.captures.filter((c) => (S.showRetired || c.status !== 'retired') && (!q || (c.text || '').toLowerCase().includes(q) || (c.area || '').toLowerCase().includes(q)));
    h += `<div class="sec-h"${due.length ? '' : ' style="margin-top:6px"'}><h2>All pearls</h2><span class="small muted">${S.captures.filter((c) => c.status !== 'retired').length} active</span></div>
      <label for="p-q" class="faint" style="font-weight:400">Search</label>
      <input id="p-q" type="search" placeholder="Search text or area" value="${esc(S.pearlQuery)}" autocomplete="off">
      <div class="sub-actions"><button class="link quiet" data-act="toggle-retired">${S.showRetired ? 'Hide' : 'Show'} retired pearls</button></div>
      <section class="card list-card" style="margin-top:6px">`;
    if (!list.length) {
      h += `<div class="empty">${S.captures.length ? 'Nothing matches.' : 'No pearls yet. Tap Capture to save one line from today. You will see it again in 3 days and in 2 weeks.'}</div>`;
    }
    for (const c of list) {
      const conf = S.confirmDel === c.id;
      h += `<div class="pearl${c.status === 'retired' ? ' retired' : ''}"><div class="pearl-text">${esc(c.text)}</div>${pearlMeta(c)}
        <div class="sub-actions">${conf
          ? `<span class="small">Delete for good?</span><button class="btn sm danger" data-act="pearl-del-yes" data-id="${esc(c.id)}">Delete</button><button class="link quiet" data-act="pearl-del-no">Keep</button>`
          : `<button class="link quiet" data-act="pearl-del" data-id="${esc(c.id)}">Delete</button>`}</div></div>`;
    }
    h += '</section>';
    return h;
  }
  function pearlMeta(c) {
    const link = safeUrl(c.link);
    let when = '';
    if (c.status === 'retired') when = 'Retired';
    else if (c.nextReview) when = `Next review ${fmtDM(c.nextReview)}`;
    return `<div class="pearl-meta"><span>${esc(c.area || 'Other')}</span><span>Saved ${esc(c.created ? fmtDM(c.created) : '')}</span><span>${esc(when)}</span>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Open link</a>` : ''}</div>`;
  }

  // ---------- sheets ----------
  function openSheet(sheet) {
    S.sheet = sheet;
    renderSheet();
    document.body.classList.add('locked');
    const focusEl = $('#sheet [data-autofocus]') || $('#sheet button');
    if (focusEl) focusEl.focus();
  }
  function closeSheet() {
    S.sheet = null;
    if (S.form && S.form.inSheet) S.form = null;
    const el = $('#sheet');
    el.hidden = true; el.innerHTML = '';
    document.body.classList.remove('locked');
  }
  function renderSheet() {
    const el = $('#sheet');
    if (!S.sheet) { el.hidden = true; return; }
    el.className = 'sheet';
    el.hidden = false;
    el.innerHTML = S.sheet.kind === 'day' ? daySheet(S.sheet.ds) : captureSheet();
  }
  function daySheet(ds) {
    const di = dayInfo(ds);
    const st = studyFor(di);
    const ov = S.days[ds] || {};
    const cur = ov.type && ov.type !== 'auto' ? ov.type : 'auto';
    const opt = (t, label) => `<button class="btn" data-act="day-set" data-ds="${ds}" data-type="${t}" aria-pressed="${cur === t}">${esc(label)}</button>`;
    const autoLabel = typeLabel(dayInfo(ds, true));
    return `<div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title">${esc(fmt(ds, { weekday: 'long', day: 'numeric', month: 'long' }))}</h2>
      <p class="hint">${di.rot ? esc(di.rot.label) + '. ' : ''}${st.count ? `${st.count} questions: ${esc(topicTitle(st))}.` : esc(st.reason)}</p>
      ${logSection(ds)}
      <div class="sec-h" style="margin:18px 0 0"><h2>Day type</h2></div>
      <div class="opts">
        ${opt('auto', 'From rotation (' + autoLabel + ')')}
        ${opt('normal', 'Working day')}
        ${opt('call', 'On call')}
        ${opt('postcall', 'Post-call')}
        ${opt('off', 'Day off')}
        ${opt('pulled', 'Pulled in')}
      </div>
      <div class="opts" style="grid-template-columns:1fr">
        <button class="btn" data-act="rough" data-ds="${ds}" aria-pressed="${!!ov.rough}">${ov.rough ? 'Rough day is on: tap to turn off' : 'Rough day: cut to the minimum'}</button>
      </div>
      <p class="hint">On call and post-call days need no questions. Pulled in and rough days drop to the minimum.</p>
      ${(() => { const l = sessionsOn(ds); return l.length ? `<div class="sec-h" style="margin:18px 0 0"><h2>Sessions</h2></div>${sessRows(l.filter((x) => x.kind === 'core'))}${l.some((x) => x.kind !== 'core') ? `<details class="more"><summary>${plural(l.filter((x) => x.kind !== 'core').length, 'division session')}, optional</summary>${sessRows(l.filter((x) => x.kind !== 'core'))}</details>` : ''}` : ''; })()}
      <div class="actions"><button class="btn ghost" data-act="sheet-close" data-autofocus>Close</button></div>
    </div>`;
  }
  function captureSheet() {
    const c = S.cap;
    const areas = AREAS.map((a) => `<option${a === c.area ? ' selected' : ''}>${esc(a)}</option>`).join('');
    return `<div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title">Quick capture</h2>
      <p class="hint">One line you want to remember. Never a name, record number, birth date, or bed number. Details go in OneNote.</p>
      <label for="c-text">Pearl</label>
      <textarea id="c-text" maxlength="280" rows="3" placeholder="e.g. Hold metformin 48 h after iodinated contrast if eGFR under 30" data-autofocus>${esc(c.text)}</textarea>
      <div class="counter" id="c-count">${c.text.length}/280</div>
      <label for="c-area">Area</label>
      <select id="c-area">${areas}</select>
      <label for="c-link">Link <span class="faint">(optional, AMBOSS or OneNote)</span></label>
      <input id="c-link" type="url" inputmode="url" placeholder="https://" value="${esc(c.link)}" autocomplete="off">
      ${c.phi ? `<div class="phi"><strong>This might identify a patient:</strong> it contains ${esc(c.phi.join(', '))}. Remove it, or save only if you are sure it is not patient information.</div>` : ''}
      <div class="actions">
        <button class="btn primary" data-act="cap-save">${c.phi ? 'Save anyway' : 'Save pearl'}</button>
        <button class="btn ghost" data-act="sheet-close">Cancel</button>
      </div>
    </div>`;
  }
  const PHI = [
    [/\b\d{6,}\b/, 'a long number'],
    [/\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/, 'a date'],
    [/\b(mr|mrs|ms|miss)\b\.?\s+[a-z]/i, 'a name title'],
    [/\b(bed|room|rm)\s*#?\s*\d+/i, 'a bed or room number'],
    [/\+?\d[\d\s\-]{8,}\d/, 'a phone-like number'],
    [/\b(patient|pt)\s+[A-Z][a-z]{2,}/, 'what looks like a name'],
  ];
  function phiHits(text) {
    const hits = [];
    for (const [re, label] of PHI) if (re.test(text) && !hits.includes(label)) hits.push(label);
    return hits;
  }

  // ---------- actions ----------
  const ACT = {
    tab(el) { S.view = el.dataset.view; S.form = null; S.confirmDel = null; render(); window.scrollTo(0, 0); },
    capture() { openSheet({ kind: 'capture' }); },
    'sheet-close'() { closeSheet(); },
    'day-open'(el) { openSheet({ kind: 'day', ds: el.dataset.ds }); },
    async 'day-set'(el) {
      const ds = el.dataset.ds, type = el.dataset.type;
      const cur = S.days[ds] || {};
      const ok = await write(() => (type === 'auto' && !cur.rough ? docRef('days', ds).delete() : docRef('days', ds).set({ type, rough: !!cur.rough })));
      if (ok) closeSheet();
    },
    async rough(el) {
      const ds = el.dataset.ds;
      const cur = S.days[ds] || {};
      const rough = !cur.rough;
      const type = cur.type || 'auto';
      await write(() => (!rough && type === 'auto' ? docRef('days', ds).delete() : docRef('days', ds).set({ type, rough })), rough ? 'Rough day: today is just the minimum.' : 'Back to the normal plan.');
      if (S.sheet) renderSheet();
    },
    'done-open'(el) {
      const ds = el.dataset.ds;
      const l = S.log[ds];
      const st = studyFor(dayInfo(ds));
      S.form = { ds, q: l && l.status === 'done' ? num(l.questions, 10) : (st.count || num(S.settings.minDay, 10)), pct: l && typeof l.pct === 'number' ? l.pct : '', inSheet: el.dataset.in === 'sheet' };
      render();
      if (S.sheet) renderSheet();
      const i = $('#f-q'); if (i) i.focus();
    },
    'day-log'(el) {
      const ds = el.dataset.ds;
      const st = studyFor(dayInfo(ds));
      S.form = { ds, q: st.count || num(S.settings.minDay, 10), pct: '', inSheet: true };
      openSheet({ kind: 'day', ds });
      const i = $('#f-q'); if (i) i.focus();
    },
    'done-cancel'() { S.form = null; render(); if (S.sheet) renderSheet(); },
    'q-step'(el) {
      const n = Number(el.dataset.n);
      S.form.q = Math.max(1, Math.min(300, (Number(S.form.q) || 0) + n));
      $('#f-q').value = S.form.q;
    },
    async 'done-save'() {
      const f = S.form;
      const q = Math.round(Number(f.q));
      if (!q || q < 1 || q > 300) { toast('Enter how many questions you answered (1 to 300).'); return; }
      let pct = f.pct === '' || f.pct == null ? null : Math.round(Number(f.pct));
      if (pct != null && (isNaN(pct) || pct < 0 || pct > 100)) { toast('Percent correct should be between 0 and 100, or left empty.'); return; }
      const st = studyFor(dayInfo(f.ds));
      const topic = st.kind === 'rest' ? 'Bonus questions' : topicTitle(st);
      const when = f.ds === todayStr() ? '' : ` for ${fmtShort(f.ds)}`;
      const ok = await write(() => docRef('log', f.ds).set({ status: 'done', questions: q, pct, topic, at: new Date().toISOString() }), `Logged ${q} questions${when}. Nice.`);
      if (ok) { S.form = null; render(); if (S.sheet) renderSheet(); }
    },
    async more(el) {
      const ds = el.dataset.ds; const l = S.log[ds];
      if (!l) return;
      const q = num(l.questions, 0) + 10;
      await write(() => docRef('log', ds).set(Object.assign({}, l, { questions: q, at: new Date().toISOString() })), `${q} questions today.`);
    },
    async skip(el) {
      const ds = el.dataset.ds;
      const st = studyFor(dayInfo(ds));
      await write(() => docRef('log', ds).set({ status: 'skipped', questions: 0, pct: null, topic: topicTitle(st), at: new Date().toISOString() }));
    },
    async undo(el) { await write(() => docRef('log', el.dataset.ds).delete(), 'Undone.'); },
    async anki(el) {
      const ds = el.dataset.ds;
      const on = !(S.extras[ds] && S.extras[ds].anki);
      await write(() => docRef('extras', ds).set({ anki: on }));
    },
    async 'pearl-ok'(el) {
      const c = S.captures.find((x) => x.id === el.dataset.id); if (!c) return;
      const stage = num(c.stage, 0);
      const patch = stage >= 1
        ? { stage: stage + 1, status: 'retired', nextReview: null, retiredOn: todayStr() }
        : { stage: stage + 1, nextReview: addDays(todayStr(), 14) };
      await write(() => docRef('captures', c.id).update(patch), stage >= 1 ? 'Retired. It is yours now.' : 'See you in 2 weeks.');
    },
    async 'pearl-again'(el) { await write(() => docRef('captures', el.dataset.id).update({ nextReview: addDays(todayStr(), 1) }), 'Back tomorrow.'); },
    'pearl-del'(el) { S.confirmDel = el.dataset.id; render(); },
    'pearl-del-no'() { S.confirmDel = null; render(); },
    async 'pearl-del-yes'(el) { const ok = await write(() => docRef('captures', el.dataset.id).delete(), 'Deleted.'); if (ok) { S.confirmDel = null; render(); } },
    'toggle-retired'() { S.showRetired = !S.showRetired; render(); },
    async 'cap-save'() {
      const c = S.cap;
      const text = c.text.trim();
      if (!text) { toast('Write one line first.'); return; }
      const hits = phiHits(text);
      const sameWarning = c.phi && hits.join() === c.phi.join();
      if (hits.length && !sameWarning) { c.phi = hits; renderSheet(); return; }
      const link = c.link.trim();
      if (link && !safeUrl(link)) { toast('The link should start with https:// or onenote:'); return; }
      const ds = todayStr();
      const ok = await write(() => db.collection('captures').add({ text, area: c.area, link: link || null, created: ds, stage: 0, nextReview: addDays(ds, 3), status: 'active' }), 'Saved. You will see it again in 3 days.');
      if (ok) { S.cap = { text: '', area: c.area, link: '', phi: null }; closeSheet(); }
    },
    chart(el) {
      S.chartSel = el.dataset.w;
      document.querySelectorAll('#chart8 .hit').forEach((h) => h.classList.toggle('on', h === el));
      $('#chart-readout').textContent = el.dataset.tip;
    },
    async backup() {
      let dl = null;
      try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
      if (!dl) { toast('Downloads are not available in this view.'); return; }
      const data = { exportedAt: new Date().toISOString(), blocks: S.blocks, plan: S.plan, log: S.log, days: S.days, extras: S.extras, captures: S.captures, sessions: S.sessions, settings: S.settings };
      try { await dl.save({ filename: `residentflow-backup-${todayStr()}.json`, data: JSON.stringify(data, null, 2) }); }
      catch (e) { if (!e || e.code !== 'declined') toast('Could not save the file.'); }
    },
  };

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) {
      if (ev.target.id === 'sheet') closeSheet();
      return;
    }
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName !== 'A') ev.preventDefault();
    fn(el);
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'f-q' && S.form) S.form.q = t.value;
    else if (t.id === 'f-pct' && S.form) S.form.pct = t.value;
    else if (t.id === 'c-text') { S.cap.text = t.value; const n = $('#c-count'); if (n) n.textContent = `${t.value.length}/280`; }
    else if (t.id === 'c-link') S.cap.link = t.value;
    else if (t.id === 'c-area') S.cap.area = t.value;
    else if (t.id === 'p-q') {
      S.pearlQuery = t.value;
      clearTimeout(ACT._pq);
      ACT._pq = setTimeout(() => { const pos = t.selectionStart; render(); const i = $('#p-q'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} } }, 200);
    }
  });
  document.addEventListener('change', (ev) => { if (ev.target.id === 'c-area') S.cap.area = ev.target.value; });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.sheet) closeSheet(); });

  // re-render when the day rolls over or the page comes back into view
  let lastDay = todayStr();
  const checkDay = () => { const d = todayStr(); if (d !== lastDay) { lastDay = d; S.form = null; render(); } };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastDay = ''; checkDay(); } });
  setInterval(checkDay, 60000);
  let rz;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'study' && S.status !== 'loading') drawWeeksChart(todayStr()); }, 150); });

  // ---------- data ----------
  async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.status = 'nodb'; render(); return; }
    try { db = await c.use('db'); } catch (e) { db = null; }
    if (!db) { S.status = 'nodb'; render(); return; }
    const waiting = new Set(['blocks', 'plan', 'log', 'days', 'extras', 'captures', 'sessions', 'settings']);
    const arrived = (k) => {
      if (waiting.delete(k) && waiting.size === 0) S.status = 'ready';
      if (S.status !== 'loading') { render(); if (S.sheet && S.sheet.kind === 'day') renderSheet(); }
    };
    const onErr = (k) => () => { toast('Some of your data could not load. Try reopening the page.'); arrived(k); };
    const keyed = (name) => db.collection(name).onSnapshot((snap) => {
      const o = {};
      for (const d of snap.docs) o[d.id] = d.data();
      S[name] = o;
      arrived(name);
    }, onErr(name));
    db.collection('blocks').onSnapshot((snap) => {
      S.blocks = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((b) => b.start && b.end).sort((a, b) => (a.start < b.start ? -1 : 1));
      arrived('blocks');
    }, onErr('blocks'));
    keyed('plan'); keyed('log'); keyed('days'); keyed('extras'); keyed('sessions');
    db.collection('captures').onSnapshot((snap) => {
      S.captures = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => ((a.created || '') < (b.created || '') ? 1 : -1));
      arrived('captures');
    }, onErr('captures'));
    db.doc('settings/main').onSnapshot((d) => { S.settings = (d.exists && d.data()) || {}; arrived('settings'); }, onErr('settings'));
    setTimeout(() => { if (S.status === 'loading') { S.status = 'ready'; render(); } }, 9000);
  }

  render();
  connect();
})();
</script>
